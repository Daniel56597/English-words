<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по словам Unit 9</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .target-word {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
            cursor: pointer;
            display: inline-block;
        }

        .target-word:hover {
            opacity: 0.8;
        }

        .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #2b3b55;
            color: var(--text);
            border: 2px solid var(--border);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background-color: #334768;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .option-btn.correct {
            border-color: var(--accent);
            background-color: var(--accent);
            color: white;
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background-color: var(--danger);
            color: white;
        }

        .action-container {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: none;
        }

        .btn-next:hover {
            background-color: var(--primary-hover);
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .results-stats {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-restart:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Тест по словам: Unit 9</h1>
        
        <div id="quiz-screen">
            <div class="stats-bar">
                <span id="progress-text">Слово: 1 / 54</span>
                <span id="errors-text">Ошибок: 0</span>
            </div>

            <div class="word-display">
                <div class="target-word" id="target-word" onclick="speakCurrentWord()" title="Нажмите, чтобы прослушать">word</div>
                <div class="hint">🔊 Нажмите на слово для озвучки. Кликните вариант ответа один раз для выбора, второй раз — для подтверждения.</div>
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Варианты генерируются динамически -->
            </div>

            <div class="action-container">
                <button class="btn-next" id="btn-next" onclick="nextQuestion()">Следующее слово ➔</button>
            </div>
        </div>

        <div class="results-screen" id="results-screen">
            <h2>Тест завершен! 🎉</h2>
            <div class="results-stats" id="results-stats">
                <!-- Статистика -->
            </div>
            <button class="btn-restart" onclick="restartQuiz()">Пройти заново</button>
        </div>
    </div>

    <script>
        // Полный словарь из ваших картинок (Unit 9)
        const rawVocabulary = [
            { en: "bake", ru: "печь, выпекать" },
            { en: "beef", ru: "говядина" },
            { en: "boil", ru: "варить" },
            { en: "bowl", ru: "миска, пиала" },
            { en: "bread", ru: "хлеб" },
            { en: "castle", ru: "замок" },
            { en: "chicken", ru: "курица" },
            { en: "chop", ru: "резать, рубить" },
            { en: "cube", ru: "кубик" },
            { en: "delicious", ru: "вкусный" },
            { en: "food processor", ru: "кухонный комбайн" },
            { en: "fork", ru: "вилка" },
            { en: "fruit", ru: "фрукт" },
            { en: "fry", ru: "жарить" },
            { en: "frying pan", ru: "сковорода" },
            { en: "honey", ru: "мед" },
            { en: "ingredient", ru: "ингредиент" },
            { en: "jam", ru: "джем, варенье" },
            { en: "kettle", ru: "чайник" },
            { en: "knife", ru: "нож" },
            { en: "lemon", ru: "лимон" },
            { en: "lemonade", ru: "лимонад" },
            { en: "main course", ru: "главное блюдо" },
            { en: "microwave", ru: "микроволновка" },
            { en: "mix", ru: "смешивать" },
            { en: "mushroom", ru: "гриб" },
            { en: "noodles", ru: "лапша" },
            { en: "olive", ru: "оливка" },
            { en: "oven", ru: "духовка" },
            { en: "pasta", ru: "паста, макароны" },
            { en: "pear", ru: "груша" },
            { en: "plate", ru: "тарелка" },
            { en: "prepare", ru: "горотовить, подготавливать" },
            { en: "ready-made", ru: "готовый (о еде)" },
            { en: "rice", ru: "рис" },
            { en: "roast", ru: "запекать, жарить в духовке" },
            { en: "rooftop", ru: "крыша" },
            { en: "salad", ru: "салат" },
            { en: "saucepan", ru: "кастрюля" },
            { en: "secret", ru: "секрет" },
            { en: "spoon", ru: "ложка" },
            { en: "starter", ru: "закуска" },
            { en: "survey", ru: "опрос" },
            { en: "sweet", ru: "сладкий" },
            { en: "sweetcorn", ru: "кукуруза (сладкая)" },
            { en: "takeaway food", ru: "еда на вынос" },
            { en: "unhealthy", ru: "нездоровый, вредный" },
            { en: "vegetable", ru: "овощ" },
            { en: "view", ru: "вид, пейзаж" },
            { en: "wonderful", ru: "замечательный" },
            { en: "yoghurt", ru: "йогурт" }
        ];

        let questions = [];
        let currentIndex = 0;
        let errorCount = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;

        // Web Audio API для звуков правильного/неправильного ответа
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Озвучка текста через браузер
        function speakText(text, lang = 'en-US') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Остановка предыдущей речи
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentWord() {
            if (questions[currentIndex]) {
                speakText(questions[currentIndex].en, 'en-US');
            }
        }

        // Перемешивание массива
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            questions = shuffle(rawVocabulary);
            currentIndex = 0;
            errorCount = 0;
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            selectedOptionIndex = null;
            isAnswered = false;
            document.getElementById('btn-next').style.display = 'none';

            const currentQ = questions[currentIndex];
            document.getElementById('target-word').textContent = currentQ.en;
            document.getElementById('progress-text').textContent = `Слово: ${currentIndex + 1} / ${questions.length}`;
            document.getElementById('errors-text').textContent = `Ошибок: ${errorCount}`;

            // Автоматическая озвучка нового слова
            speakCurrentWord();

            // Создаем варианты ответов (1 правильный + 3 случайных неправильных)
            let wrongOptions = rawVocabulary
                .filter(item => item.ru !== currentQ.ru)
                .map(item => item.ru);
            wrongOptions = shuffle(wrongOptions).slice(0, 3);

            let options = [...wrongOptions, currentQ.ru];
            options = shuffle(options);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.dataset.index = idx;
                btn.dataset.text = opt;

                // Клик по варианту ответа
                btn.onclick = () => handleOptionClick(idx, opt, currentQ.ru, btn);
                grid.appendChild(btn);
            });
        }

        function handleOptionClick(idx, chosenText, correctText, btnElement) {
            if (isAnswered) return;

            // Озвучиваем выбранный вариант при нажатии
            speakText(chosenText, 'ru-RU');

            const buttons = document.querySelectorAll('.option-btn');

            if (selectedOptionIndex === idx) {
                // ВТОРОЙ КЛИК — подтверждение выбора
                isAnswered = true;
                const isCorrect = (chosenText === correctText);

                if (isCorrect) {
                    btnElement.classList.add('correct');
                    playSound('correct');
                } else {
                    btnElement.classList.add('wrong');
                    errorCount++;
                    playSound('wrong');
                    // Подсветим правильный ответ
                    buttons.forEach(b => {
                        if (b.dataset.text === correctText) {
                            b.classList.add('correct');
                        }
                    });
                }

                document.getElementById('errors-text').textContent = `Ошибок: ${errorCount}`;
                document.getElementById('btn-next').style.display = 'block';

            } else {
                // ПЕРВЫЙ КЛИК — подсветка выбора
                buttons.forEach(b => b.classList.remove('selected'));
                btnElement.classList.add('selected');
                selectedOptionIndex = idx;
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const resScreen = document.getElementById('results-screen');
            resScreen.style.display = 'block';

            const passedCount = questions.length;
            document.getElementById('results-stats').innerHTML = `
                Ты прошел слов: <b>${passedCount}</b><br>
                Всего ошибок: <span style="color: var(--danger);"><b>${errorCount}</b></span>
            `;
            speakText("Тест завершен! Отличная работа!", "ru-RU");
        }

        function restartQuiz() {
            initQuiz();
        }

        // Запуск при загрузке
        window.onload = initQuiz;
    </script>
</body>
</html>
